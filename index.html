<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>英単語暗記（完成版）</title>

<style>
body {
  font-family: Arial;
  background: #1e1e2f;
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: #2c2c44;
  padding: 20px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
}

input {
  margin-top: 15px;
  padding: 12px;
  width: 90%;
  border-radius: 10px;
  border: none;
}

button, select {
  margin-top: 8px;
  padding: 12px;
  width: 90%;
  border-radius: 10px;
  border: none;
}

button { background: #00ffaa; }

.result { margin-top: 10px; font-weight: bold; }
.correct { color: #00ffaa; }
.wrong { color: #ff5555; }

.small { font-size: 14px; margin-top: 5px; }

/* 👇ゲージ */
.bar {
  width: 90%;
  height: 10px;
  background: #444;
  margin: 10px auto;
  border-radius: 10px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: #00ffaa;
  transition: 0.3s;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="question"></h1>

  <div class="bar">
    <div id="barFill" class="bar-fill"></div>
  </div>
  <div id="masteryText" class="small"></div>

  <input id="answer" placeholder="答えを入力">

  <button onclick="checkAnswer()">答える</button>
  <button onclick="nextWord()">次へ</button>
  <button onclick="reviewMode()">復習モード</button>

  <select id="modeSelect" onchange="changeMode()">
    <option value="mix">混合</option>
    <option value="en">英→日</option>
    <option value="ja">日→英</option>
  </select>

  <button onclick="resetMastery()">♻️習得リセット</button>

  <div id="result" class="result"></div>
  <div id="stats" class="small"></div>
</div>

<script>
const words = [
{ en:"twice", ja:"2回、2倍、2度" },
{ en:"post", ja:"投稿する" },
{ en:"media", ja:"媒体、メディア、マスメディア、マスコミ" },
{ en:"social media", ja:"SNS、ソーシャルメディア" },
{ en:"blog", ja:"ブログ" },
{ en:"come up with", ja:"思いつく、考え出す" },
{ en:"workshop", ja:"講習会、作業場、研究会、研修会" },
{ en:"attract", ja:"引きつける、魅了する" },
{ en:"clip", ja:"切り抜き、クリップする、クリップ" },
{ en:"edit", ja:"編集する" },
{ en:"hobby", ja:"趣味" },
{ en:"anybody", ja:"誰でも、だれでも" },
{ en:"beginner", ja:"初心者" },
{ en:"close", ja:"閉じる、近い、接近した" },
{ en:"wind", ja:"風" },
{ en:"awesome", ja:"すごい、最高、素晴らしい" },
{ en:"rap", ja:"ラップ、ラップの曲" },
{ en:"bound", ja:"〜行きの、縛られた、行きの" },
{ en:"option", ja:"選択肢、選択" },
{ en:"entire", ja:"全体の、全部の" },
{ en:"hurry", ja:"急ぐ、急ぎ、急ぐこと" },
{ en:"crowded", ja:"混雑した、混んでいる、混み合った" },
{ en:"apologize", ja:"謝る、お詫びする、謝罪する" },
{ en:"temporarily", ja:"一時的に" },
{ en:"estimate", ja:"見積もる、推定する、概算する" },
{ en:"later", ja:"後で、後ほど" },
{ en:"alone", ja:"ひとりで、ひとりの" },
{ en:"true", ja:"本当の、真実の" },
{ en:"playlist", ja:"再生リスト" },
{ en:"summertime", ja:"夏季、夏の時期" },
{ en:"those", ja:"それらの、それら" },
{ en:"melody", ja:"メロディー、旋律" },
{ en:"remind", ja:"思い出させる" },
{ en:"rhythm", ja:"リズム" },
{ en:"remind...of~", ja:"…に〜を思い出させる" },
{ en:"debut", ja:"デビュー" },
{ en:"title", ja:"題名、タイトル" },
{ en:"complex", ja:"複雑な" },
{ en:"impossible", ja:"不可能な" },
{ en:"unhappy", ja:"不幸な、悲しい" },
{ en:"word", ja:"言葉、単語" },
{ en:"throughout", ja:"〜の間中、〜の至る所で" },
{ en:"person", ja:"人" },
{ en:"ask for", ja:"求める、頼む" },
{ en:"contrast", ja:"対比、対照" },
{ en:"concern", ja:"心配、懸念" },
{ en:"afraid", ja:"恐れて、怖がって" },
{ en:"passion", ja:"情熱" },
{ en:"upbeat", ja:"陽気な、前向きな" },
{ en:"roller", ja:"ローラー" },
{ en:"coaster", ja:"コースター" },
{ en:"roller coaster", ja:"ジェットコースター" },
{ en:"close", ja:"近い、親しい、閉じる" },
{ en:"daytime", ja:"昼間" },
{ en:"double", ja:"2倍の、2重の" },
{ en:"feel free to", ja:"気軽に〜してください" },
{ en:"numbered", ja:"番号が付けられた" },
{ en:"haunted", ja:"幽霊の出る" },
{ en:"according", ja:"〜によれば、〜に従って" },
{ en:"Ferris wheel", ja:"観覧車" },
{ en:"app", ja:"アプリ" }
];

let mastery = JSON.parse(localStorage.getItem("mastery")) || {};
let current;
let mode = "mix";
let isEnglishToJapanese;

// 保存
function save(){
  localStorage.setItem("mastery", JSON.stringify(mastery));
}

// 出題リスト（ここが重要🔥）
function getList(){
  return words.filter(w => (mastery[w.en] || 0) < 20);
}

// 出題方向
function getDir(){
  if(mode==="mix") return Math.random()<0.5;
  if(mode==="en") return true;
  return false;
}

function nextWord(){
  const list = getList();

  if(list.length === 0){
    question.textContent = "🎉 全部習得！";
    return;
  }

  current = list[Math.floor(Math.random() * list.length)];
  isEnglishToJapanese = getDir();

  question.textContent = isEnglishToJapanese ? current.en : current.ja;

  answer.value = "";
  result.textContent = "";

  updateBar();
}

// 👇ゲージ更新
function updateBar(){
  let val = mastery[current.en] || 0;
  let percent = (val / 20) * 100;

  barFill.style.width = percent + "%";
  masteryText.textContent = `習得度: ${val}/20`;
}

function checkAnswer(){
  const input = answer.value.trim();
  const correct = isEnglishToJapanese ? current.ja : current.en;

  if(correct.includes(input) && input !== ""){
    result.textContent = "正解！ 正答: " + correct;
    result.className = "result correct";

    mastery[current.en] = (mastery[current.en] || 0) + 1;

  } else {
    result.textContent = "不正解… 正解: " + correct;
    result.className = "result wrong";
  }

  save();
  updateBar();
}

function changeMode(){
  mode = modeSelect.value;
}

function resetMastery(){
  if(confirm("リセットする？")){
    mastery = {};
    save();
    nextWord();
  }
}

answer.addEventListener("keypress", e=>{
  if(e.key==="Enter") checkAnswer();
});

nextWord();
</script>

</body>
</html>
