<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語暗記（ガチモード）</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #2c2c44;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 24px;
      word-break: break-word;
    }

    input {
      margin-top: 15px;
      padding: 14px;
      width: 90%;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 90%;
      border: none;
      border-radius: 10px;
      background: #00ffaa;
      color: black;
      font-weight: bold;
      font-size: 16px;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .correct { color: #00ffaa; }
    .wrong { color: #ff5555; }

    .mode {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="question"></h1>

    <input type="text" id="answer" placeholder="答えを入力">

    <button onclick="checkAnswer()">答える</button>
    <button onclick="nextWord()">次へ</button>
    <button onclick="reviewMode()">復習モード</button>

    <div id="result" class="result"></div>
    <div id="mode" class="mode">通常モード</div>
  </div>

  <script>
    const words = [
      { en: "twice", ja: "2回、2倍、2度" },
      { en: "post", ja: "投稿する" },
      { en: "media", ja: "媒体、メディア、マスメディア、マスコミ" },
      { en: "social media", ja: "SNS、ソーシャルメディア" },
      { en: "blog", ja: "ブログ" },
      { en: "come up with", ja: "思いつく、考え出す" },
      { en: "workshop", ja: "講習会、作業場、研究会、研修会" },
      { en: "attract", ja: "引きつける、魅了する" },
      { en: "clip", ja: "切り抜き、クリップする、クリップ" },
      { en: "edit", ja: "編集する" },
      { en: "hobby", ja: "趣味" },
      { en: "anybody", ja: "誰でも、だれでも" },
      { en: "beginner", ja: "初心者" },
      { en: "close", ja: "閉じる、近い、接近した" },
      { en: "wind", ja: "風" },
      { en: "awesome", ja: "すごい、最高、素晴らしい" },
      { en: "rap", ja: "ラップ、ラップの曲" },
      { en: "bound", ja: "〜行きの、縛られた、行きの" },
      { en: "option", ja: "選択肢、選択" },
      { en: "entire", ja: "全体の、全部の" },
      { en: "hurry", ja: "急ぐ、急ぎ、急ぐこと" },
      { en: "crowded", ja: "混雑した、混んでいる、混み合った" },
      { en: "apologize", ja: "謝る、お詫びする、謝罪する" },
      { en: "temporarily", ja: "一時的に" },
      { en: "estimate", ja: "見積もる、推定する、概算する" },
      { en: "later", ja: "後で、後ほど" }
    ];

    let wrongWords = [];
    let current;
    let isReview = false;
    let isEnglishToJapanese = true;

    function getList() {
      return isReview && wrongWords.length > 0 ? wrongWords : words;
    }

    function nextWord() {
      const list = getList();
      current = list[Math.floor(Math.random() * list.length)];

      // 出題方向ランダム
      isEnglishToJapanese = Math.random() < 0.5;

      if (isEnglishToJapanese) {
        document.getElementById("question").textContent = current.en;
      } else {
        document.getElementById("question").textContent = current.ja;
      }

      document.getElementById("answer").value = "";
      document.getElementById("result").textContent = "";
    }

    function checkAnswer() {
      const input = document.getElementById("answer").value.trim();

      let correctAnswer = isEnglishToJapanese ? current.ja : current.en;

      if (correctAnswer.includes(input) && input !== "") {
        document.getElementById("result").textContent = "正解！";
        document.getElementById("result").className = "result correct";

        wrongWords = wrongWords.filter(w => w.en !== current.en);

      } else {
        document.getElementById("result").textContent =
          "不正解… 正解: " + correctAnswer;
        document.getElementById("result").className = "result wrong";

        if (!wrongWords.some(w => w.en === current.en)) {
          wrongWords.push(current);
        }
      }
    }

    function reviewMode() {
      if (wrongWords.length === 0) {
        alert("まだ間違えた単語がない！");
        return;
      }
      isReview = true;
      document.getElementById("mode").textContent = "復習モード（ミスのみ）";
      nextWord();
    }

    // Enter対応（修正済み）
    document.getElementById("answer").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        checkAnswer();
      }
    });

    nextWord();
  </script>

</body>
</html>
