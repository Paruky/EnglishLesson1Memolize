<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lesson1 英語暗記</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --bg: #10131a;
  --panel: #1d2430;
  --panel-strong: #273241;
  --text: #f7fbff;
  --muted: #aeb9c6;
  --accent: #31d39a;
  --accent-strong: #13b77e;
  --danger: #ff6b7a;
  --line: rgba(255,255,255,0.12);
  --shadow: 0 18px 46px rgba(0,0,0,0.28);
}

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100svh;
  margin: 0;
  padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: grid;
  place-items: start center;
  background:
    radial-gradient(circle at top left, rgba(49,211,154,0.16), transparent 34rem),
    linear-gradient(135deg, #10131a 0%, #182030 48%, #0f1720 100%);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  width: min(100%, 520px);
  margin-block: min(6vh, 36px);
}

.card {
  width: 100%;
  padding: clamp(18px, 5vw, 28px);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(29,36,48,0.94);
  box-shadow: var(--shadow);
}

.app-title {
  margin: 0 0 16px;
  font-size: clamp(22px, 7vw, 34px);
  line-height: 1.15;
  letter-spacing: 0;
}

.question-label {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

#question {
  min-height: 3.4em;
  margin: 0;
  display: grid;
  place-items: center;
  overflow-wrap: anywhere;
  padding: 18px 14px;
  border-radius: 8px;
  background: var(--panel-strong);
  font-size: clamp(26px, 9vw, 42px);
  line-height: 1.2;
  letter-spacing: 0;
}

.bar {
  width: 100%;
  height: 12px;
  background: rgba(255,255,255,0.12);
  margin: 16px 0 8px;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #79e2ff);
  transition: width 0.25s ease;
}

.small {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
}

.answer-area {
  margin-top: 18px;
  text-align: left;
}

.answer-area label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

input, button, select {
  width: 100%;
  min-height: 48px;
  border-radius: 8px;
  border: 1px solid transparent;
  font: inherit;
}

input, select {
  background: #f8fbff;
  color: #121822;
}

input {
  padding: 13px 14px;
  font-size: 18px;
}

input:focus, button:focus-visible, select:focus {
  outline: 3px solid rgba(121,226,255,0.38);
  outline-offset: 2px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.controls button:first-child {
  grid-column: 1 / -1;
}

button {
  padding: 12px 14px;
  background: var(--accent);
  color: #07130e;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: translateY(1px);
}

button.secondary {
  background: #d8e6f0;
  color: #15202b;
}

button.danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(255,107,122,0.48);
}

.settings {
  display: grid;
  gap: 10px;
  margin-top: 16px;
  text-align: left;
}

.settings label {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

select {
  margin-top: 8px;
  padding: 0 12px;
}

.result {
  min-height: 2.8em;
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.07);
  font-weight: 800;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.result:empty {
  display: none;
}

.correct {
  color: var(--accent);
}

.wrong {
  color: var(--danger);
}

#stats {
  margin-top: 12px;
}

@media (max-width: 420px) {
  body {
    padding-inline: 12px;
  }

  .card {
    padding: 16px;
  }

  .app {
    margin-block: 0;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  #question {
    min-height: 3em;
    padding-inline: 10px;
  }
}
</style>
</head>

<body>

<main class="app">
<section class="card" aria-label="英単語暗記アプリ">
  <h1 class="app-title">Lesson1 英語暗記</h1>

  <p class="question-label">問題</p>
  <div id="question" role="heading" aria-level="2"></div>

  <div class="bar">
    <div id="barFill" class="bar-fill"></div>
  </div>
  <div id="masteryText" class="small"></div>

  <div class="answer-area">
    <label for="answer">答え</label>
    <input id="answer" placeholder="ここに入力" autocomplete="off" autocapitalize="none">
  </div>

  <div class="controls">
    <button onclick="checkAnswer()">答える</button>
    <button class="secondary" onclick="nextWord(true)">次へ</button>
    <button class="secondary" onclick="reviewMode()">復習</button>
  </div>

  <div class="settings">
    <label for="modeSelect">出題モード
      <select id="modeSelect" onchange="changeMode()">
        <option value="mix">混合</option>
        <option value="en">英語から日本語</option>
        <option value="ja">日本語から英語</option>
      </select>
    </label>

    <button class="danger" onclick="resetMastery()">習得をリセット</button>
  </div>

  <div id="result" class="result" aria-live="polite"></div>
  <div id="stats" class="small"></div>
</section>
</main>

<script>
const words = [
{ en:"twice", ja:"2回、2倍、2度" },
{ en:"post", ja:"投稿する" },
{ en:"media", ja:"媒体、メディア、マスメディア、マスコミ" },
{ en:"social media", ja:"SNS、ソーシャルメディア" },
{ en:"blog", ja:"ブログ" },
{ en:"come up with", ja:"思いつく、考え出す" },
{ en:"workshop", ja:"講習会、作業場、研究会、研修会" },
{ en:"attract", ja:"引きつける、魅了する" },
{ en:"clip", ja:"切り抜き、クリップする、クリップ" },
{ en:"edit", ja:"編集する" },
{ en:"hobby", ja:"趣味" },
{ en:"anybody", ja:"誰でも、だれでも" },
{ en:"beginner", ja:"初心者" },
{ en:"close", ja:"閉じる、近い、接近した" },
{ en:"wind", ja:"風" },
{ en:"awesome", ja:"すごい、最高、素晴らしい" },
{ en:"rap", ja:"ラップ、ラップの曲" },
{ en:"bound", ja:"〜行きの、縛られた、行きの" },
{ en:"option", ja:"選択肢、選択" },
{ en:"entire", ja:"全体の、全部の" },
{ en:"hurry", ja:"急ぐ、急ぎ、急ぐこと" },
{ en:"crowded", ja:"混雑した、混んでいる、混み合った" },
{ en:"apologize", ja:"謝る、お詫びする、謝罪する" },
{ en:"temporarily", ja:"一時的に" },
{ en:"estimate", ja:"見積もる、推定する、概算する" },
{ en:"later", ja:"後で、後ほど" },
{ en:"alone", ja:"ひとりで、ひとりの" },
{ en:"true", ja:"本当の、真実の" },
{ en:"playlist", ja:"再生リスト" },
{ en:"summertime", ja:"夏季、夏の時期" },
{ en:"those", ja:"それらの、それら" },
{ en:"melody", ja:"メロディー、旋律" },
{ en:"remind", ja:"思い出させる" },
{ en:"rhythm", ja:"リズム" },
{ en:"remind...of~", ja:"…に〜を思い出させる" },
{ en:"debut", ja:"デビュー" },
{ en:"title", ja:"題名、タイトル" },
{ en:"complex", ja:"複雑な" },
{ en:"impossible", ja:"不可能な" },
{ en:"unhappy", ja:"不幸な、悲しい" },
{ en:"word", ja:"言葉、単語" },
{ en:"throughout", ja:"〜の間中、〜の至る所で" },
{ en:"person", ja:"人" },
{ en:"ask for", ja:"求める、頼む" },
{ en:"contrast", ja:"対比、対照" },
{ en:"concern", ja:"心配、懸念" },
{ en:"afraid", ja:"恐れて、怖がって" },
{ en:"passion", ja:"情熱" },
{ en:"upbeat", ja:"陽気な、前向きな" },
{ en:"roller", ja:"ローラー" },
{ en:"coaster", ja:"コースター" },
{ en:"roller coaster", ja:"ジェットコースター" },
{ en:"close", ja:"近い、親しい、閉じる" },
{ en:"daytime", ja:"昼間" },
{ en:"double", ja:"2倍の、2重の" },
{ en:"feel free to", ja:"気軽に〜してください" },
{ en:"numbered", ja:"番号が付けられた" },
{ en:"haunted", ja:"幽霊の出る" },
{ en:"according", ja:"〜によれば、〜に従って" },
{ en:"Ferris wheel", ja:"観覧車" },
{ en:"app", ja:"アプリ" }
];

let mastery = JSON.parse(localStorage.getItem("mastery")) || {};
let current;
let mode = "mix";
let isEnglishToJapanese;
let reviewOnly = false;
let answered = false;

if("scrollRestoration" in history){
  history.scrollRestoration = "manual";
}

// 保存
function save(){
  localStorage.setItem("mastery", JSON.stringify(mastery));
}

// 出題リスト（ここが重要🔥）
function getList(){
  const base = words.filter(w => (mastery[w.en] || 0) < 10);
  if(!reviewOnly) return base;

  const reviewList = base.filter(w => (mastery[w.en] || 0) < 3);
  return reviewList.length ? reviewList : base;
}

// 出題方向
function getDir(){
  if(mode==="mix") return Math.random()<0.5;
  if(mode==="en") return true;
  return false;
}

function nextWord(focusAnswer = false){
  const list = getList();

  if(list.length === 0){
    question.textContent = "全部習得！";
    answer.value = "";
    result.textContent = "すべての単語が習得済みです。";
    result.className = "result correct";
    updateStats();
    return;
  }

  current = list[Math.floor(Math.random() * list.length)];
  isEnglishToJapanese = getDir();

  question.textContent = isEnglishToJapanese ? current.en : current.ja;

  answer.value = "";
  result.textContent = "";
  answered = false;

  updateBar();
  updateStats();
  if(focusAnswer) answer.focus();
}

// 👇ゲージ更新
function updateBar(){
  if(!current) return;
  let val = mastery[current.en] || 0;
  let percent = (val / 10) * 100;

  barFill.style.width = percent + "%";
  masteryText.textContent = `習得度: ${val}/10`;
}

function checkAnswer(){
  if(!current || answered) return;

  const input = answer.value.trim();
  const correct = isEnglishToJapanese ? current.ja : current.en;
  const normalizedInput = normalize(input);
  const acceptedAnswers = isEnglishToJapanese
    ? current.ja.split(/[、,]/).map(normalize).filter(Boolean)
    : [normalize(current.en)];
  const isCorrect = isEnglishToJapanese
    ? acceptedAnswers.some(item => item.includes(normalizedInput))
    : acceptedAnswers.includes(normalizedInput);

  if(normalizedInput && isCorrect){
    result.textContent = "正解！ 正答: " + correct;
    result.className = "result correct";

    mastery[current.en] = Math.min((mastery[current.en] || 0) + 1, 10);

  } else {
    result.textContent = "不正解… 正解: " + correct;
    result.className = "result wrong";
  }

  answered = true;
  save();
  updateBar();
  updateStats();
}

function changeMode(){
  mode = modeSelect.value;
  nextWord();
}

function reviewMode(){
  reviewOnly = !reviewOnly;
  result.textContent = reviewOnly ? "復習モードにしました。" : "通常モードに戻しました。";
  result.className = "result";
  nextWord();
}

function resetMastery(){
  if(confirm("リセットする？")){
    mastery = {};
    save();
    reviewOnly = false;
    nextWord();
  }
}

function updateStats(){
  const learned = words.filter(w => (mastery[w.en] || 0) >= 10).length;
  const left = words.length - learned;
  const reviewText = reviewOnly ? " / 復習中" : "";
  stats.textContent = `残り ${left}語 / 習得 ${learned}語${reviewText}`;
}

function normalize(value){
  return value.toLowerCase().replace(/\s+/g, " ").trim();
}

answer.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    if(answered) nextWord(true);
    else checkAnswer();
  }
});

function resetScroll(){
  window.scrollTo({ top: 0, left: 0, behavior: "auto" });
}

window.addEventListener("pageshow", () => {
  resetScroll();
  setTimeout(resetScroll, 80);
});

resetScroll();
nextWord();
</script>

</body>
</html>
